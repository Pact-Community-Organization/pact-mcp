# Dependabot configuration for the pact-mcp monorepo.
# Monthly grouped updates for every workspace package plus GitHub Actions,
# capped per ecosystem to keep notification volume low.

version: 2
updates:
  # Root workspace dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    ignore:
      # vite is pinned to 6.x for vitest 4 compatibility
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      # typings track the supported Node range (engines >=20.11, CI up to 24)
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      modelcontextprotocol:
        patterns:
          - "@modelcontextprotocol/*"
      dev-dependencies:
        patterns:
          - "@types/*"
          - "typescript"
          - "vitest"
          - "@vitest/*"
          - "eslint"
          - "prettier"
        update-types:
          - "major"
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/packages/mcp-shared"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    ignore:
      # vite is pinned to 6.x for vitest 4 compatibility
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      # typings track the supported Node range (engines >=20.11, CI up to 24)
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      modelcontextprotocol:
        patterns:
          - "@modelcontextprotocol/*"
      zod:
        patterns:
          - "zod"
      dev-dependencies:
        patterns:
          - "@types/*"
          - "typescript"
          - "vitest"
          - "@vitest/*"
        update-types:
          - "major"
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/packages/mcp-pact"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      kadena:
        patterns:
          - "@kadena/*"
      modelcontextprotocol:
        patterns:
          - "@modelcontextprotocol/*"

  - package-ecosystem: "npm"
    directory: "/packages/mcp-chainweb"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      kadena:
        patterns:
          - "@kadena/*"
      modelcontextprotocol:
        patterns:
          - "@modelcontextprotocol/*"

  - package-ecosystem: "npm"
    directory: "/packages/mcp-coordination"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      modelcontextprotocol:
        patterns:
          - "@modelcontextprotocol/*"

  - package-ecosystem: "npm"
    directory: "/packages/mcp-devnet"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      modelcontextprotocol:
        patterns:
          - "@modelcontextprotocol/*"

  # GitHub Actions — keeps SHA-pinned actions current
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - dependencies
      - github-actions
