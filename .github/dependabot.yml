# Dependabot configuration for the pact-mcp monorepo.
# Weekly grouped updates for every workspace package plus GitHub Actions.

version: 2
updates:
  # Root workspace dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    groups:
      modelcontextprotocol:
        patterns:
          - "@modelcontextprotocol/*"
      dev-dependencies:
        patterns:
          - "@types/*"
          - "typescript"
          - "vitest"
          - "@vitest/*"
          - "eslint"
          - "prettier"
        update-types:
          - "major"
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/packages/mcp-shared"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    groups:
      modelcontextprotocol:
        patterns:
          - "@modelcontextprotocol/*"
      zod:
        patterns:
          - "zod"
      dev-dependencies:
        patterns:
          - "@types/*"
          - "typescript"
          - "vitest"
          - "@vitest/*"
        update-types:
          - "major"
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/packages/mcp-pact"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      kadena:
        patterns:
          - "@kadena/*"
      modelcontextprotocol:
        patterns:
          - "@modelcontextprotocol/*"

  - package-ecosystem: "npm"
    directory: "/packages/mcp-chainweb"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      kadena:
        patterns:
          - "@kadena/*"
      modelcontextprotocol:
        patterns:
          - "@modelcontextprotocol/*"

  - package-ecosystem: "npm"
    directory: "/packages/mcp-coordination"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      modelcontextprotocol:
        patterns:
          - "@modelcontextprotocol/*"

  - package-ecosystem: "npm"
    directory: "/packages/mcp-devnet"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      modelcontextprotocol:
        patterns:
          - "@modelcontextprotocol/*"

  # GitHub Actions — keeps SHA-pinned actions current
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - dependencies
      - github-actions
