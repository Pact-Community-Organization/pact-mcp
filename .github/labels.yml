# --- Issue triage: type ---
- name: bug
  color: "d73a4a"
  description: "Reproducible defect"
- name: enhancement
  color: "a2eeef"
  description: "New feature or capability request"
- name: rfc
  color: "5319e7"
  description: "Open-ended design proposal — discuss before building"
- name: question
  color: "d876e3"
  description: "Usage question or support request"
- name: docs
  color: "0075ca"
  description: "Documentation gap or improvement"
- name: security
  color: "b60205"
  description: "Security-related (report vulnerabilities privately, not here)"

# --- Issue triage: status ---
- name: needs-triage
  color: "ededed"
  description: "Awaiting initial triage by a maintainer"
- name: needs-info
  color: "fef2c0"
  description: "Waiting on more information from the reporter"
- name: triaged
  color: "c5def5"
  description: "Triaged and classified"
- name: accepted
  color: "0e8a16"
  description: "Accepted for work"
- name: declined
  color: "e99695"
