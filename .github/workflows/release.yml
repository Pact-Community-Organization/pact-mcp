# Publishes the three public packages to npm via OIDC Trusted Publishing when a
# GitHub release is published. No npm token and no OTP: npmjs.com is configured
# to trust this repo + this workflow file, and provenance attestations are
# generated automatically.
#
# Two things about this repo shape the steps below:
#
#   * It is a pnpm workspace. The published packages depend on
#     @pact-community/mcp-shared via `workspace:*`, which npm does not
#     understand. `pnpm pack` rewrites that to the concrete version, so we pack
#     with pnpm and publish the resulting tarball with npm — npm is the CLI that
#     can exchange the OIDC token.
#
#   * Publish order matters. mcp-shared goes first because the other two carry a
#     hard dependency on the exact version being published alongside them.
#
# The full test suite runs before anything is published: a release is the last
# point where a bad publish is still preventable, and an npm version cannot be
# reused once taken.

name: release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

env:
  NODE_VERSION: '22.x'
  PNPM_VERSION: '9.15.1'

jobs:
  npm-publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Update npm
        # OIDC trusted publishing needs a recent npm CLI; the one bundled with
        # the Node version above predates it.
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r build

      - name: Run tests
        run: pnpm -r --workspace-concurrency=1 test

      - name: Refuse to publish a version that already exists
        # npm would reject the duplicate anyway, but only after the earlier
        # packages in the order below had already been published — leaving a
        # half-published release that cannot be undone. Fail before any publish.
        run: |
          set -euo pipefail
          for pkg in mcp-shared mcp-pact mcp-chainweb; do
            name=$(node -p "require('./packages/$pkg/package.json').name")
            version=$(node -p "require('./packages/$pkg/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "::error::$name@$version is already published. Bump the version and re-release."
              exit 1
            fi
            echo "ok: $name@$version is unpublished"
          done

      - name: Publish
        # mcp-shared first: the other two depend on the exact version being
        # published in this run.
        run: |
          set -euo pipefail
          for pkg in mcp-shared mcp-pact mcp-chainweb; do
            echo "--- packing $pkg ---"
            # Run inside the package directory: `pnpm --filter <pkg> pack` implies
            # --recursive, which `pack` rejects. pnpm resolves `workspace:*` into
            # the concrete version during pack.
            tarball=$(cd "packages/$pkg" && pnpm pack --pack-destination "$RUNNER_TEMP" | tail -1)
            test -f "$tarball" || { echo "::error::pack produced no tarball for $pkg"; exit 1; }
            echo "--- publishing $tarball ---"
            npm publish "$tarball" --access public --provenance
          done
