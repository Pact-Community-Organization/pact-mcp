name: PR Stale Close

on:
  schedule:
    - cron: '0 * * * *'  # Hourly check
  workflow_dispatch:

# Security H-2: workflow-scope read-only baseline
permissions:
  contents: read

concurrency:
  group: pr-stale-${{ github.repository }}
  cancel-in-progress: true

jobs:
  stale:
    name: Close stale PRs
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@5bef64f19d7facfed25c7e370d51f60dd4ea9f7c # v9.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          # Issues: disabled — issue lifecycle is separate
          stale-issue-message: ''
          close-issue-message: ''
          days-before-issue-stale: -1
          days-before-issue-close: -1
          # PRs: stale after 72h, close immediately after stale label applied
          days-before-stale: 3
          days-before-close: 0
          stale-pr-label: stale
          stale-pr-message: >
            [Bot] This PR has had no reviewer activity for 72 hours.
            Per Pact-Community-Organization zero-backlog policy, it will be automatically closed.
            Re-open and request review when ready.
          close-pr-message: >
            [Bot] Automatically closed after 72 hours with no reviewer activity.
            Re-open when ready for review. See Pact-Community-Organization PR governance policy.
          # Only stale PRs still waiting for initial review assignment
          only-labels: 'needs-review'
          # Protect PRs actively in review or escalation
          exempt-pr-labels: 'do-not-merge,auto-merge-enabled,tester-approved,security-approved'
